name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux credential backend build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test sync protocol, mock Google API and terminal flows
        run: cargo test --all-targets --locked
        timeout-minutes: 10
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: sshm-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/sshm
            target/release/sshm.exe
          if-no-files-found: error
